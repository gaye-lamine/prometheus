name: Deploy Backend to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: 72.60.213.116
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            mkdir -p /root/prometheus-backend
            cd /root/prometheus-backend
            # Pull latest code or sync files
            # Rebuilds and restarts the backend container
            docker compose down
            docker compose build
            docker compose up -d
